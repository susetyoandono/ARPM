<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR Preventive Maintenance — Molding</title>
<style>
:root{--p:rgba(255,255,255,.94);--t:#18222e;--a:#1f6f78;--l:rgba(0,0,0,.15);--s:rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:rgba(22,28,36,.94);--t:#e9eef3;--a:#6cc4cc;--l:rgba(255,255,255,.18);--s:rgba(255,255,255,.08)}}
:root[data-theme=dark]{--p:rgba(22,28,36,.94);--t:#e9eef3;--a:#6cc4cc;--l:rgba(255,255,255,.18);--s:rgba(255,255,255,.08)}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1c2128;color:var(--t);font:15px/1.35 system-ui,"Segoe UI",sans-serif;overflow:hidden}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#demo{position:fixed;inset:0;background:linear-gradient(#2a323c,#1c2128);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px}
#dq{position:fixed;width:120px;height:120px;padding:14px;background:#fff;box-sizing:content-box;image-rendering:pixelated}
#ov{position:fixed;inset:0;pointer-events:none}#ca{position:fixed;inset:0;pointer-events:none}
.ui{background:var(--p);backdrop-filter:blur(8px);border:1px solid var(--l);border-radius:14px}
#top{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
#top small{display:block;opacity:.75;font-size:12.5px}#top .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
#top button{border:1px solid var(--l);background:var(--s);border-radius:10px;padding:9px 12px;min-height:40px}
#prog{background:var(--a);color:#fff;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:600}
.co{--a2:#e08a1e;position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #fff;background:var(--a2);color:#fff;font-weight:700;font-size:16px;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.5);will-change:transform;padding:0}
.co.ok{--a2:#1f9d55}.co.ng{--a2:#d64545}
.co::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--a2);animation:pl 1.6s infinite}
@keyframes pl{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.35);opacity:0}}
.co span{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:rgba(15,20,26,.88);color:#fff;font-weight:600;font-size:13px;padding:5px 10px;border-radius:8px;white-space:nowrap;border:1px solid rgba(255,255,255,.25)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
#card{width:min(600px,100%);max-height:90vh;overflow:auto;padding:16px;border-radius:18px 18px 0 0;box-sizing:border-box}
@media(min-width:800px){#dlg{align-items:center}#card{border-radius:18px}}
h2{margin:0 0 2px;font-size:19px}.sub{margin:0 0 10px;opacity:.7;font-size:13px}
label{display:block;font-size:13px;opacity:.9;margin:8px 0}
input,textarea{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:var(--s);border:1px solid var(--l);border-radius:10px;padding:11px;margin-top:4px}
.it{padding:10px 0;border-top:1px solid var(--l)}.it small{opacity:.7}
.seg{display:flex;gap:8px;margin-top:6px}.seg button{flex:1;min-height:48px;border:2px solid var(--l);background:var(--s);border-radius:10px;font-weight:700}
.seg button.on[data-v="1"]{background:#1f9d55;border-color:#1f9d55;color:#fff}.seg button.on[data-v="0"]{background:#d64545;border-color:#d64545;color:#fff}
.num{display:flex;align-items:center;gap:8px}.num input{margin:6px 0 0}.num input.bad{border-color:#d64545;background:rgba(214,69,69,.15)}.num input.good{border-color:#1f9d55}
.ft{display:flex;gap:8px;margin-top:12px}.ft button{flex:1;min-height:50px;border-radius:12px;border:1px solid var(--l);background:var(--s);font-weight:700}
.ft .pr{background:var(--a);border-color:var(--a);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));padding:10px 18px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--l);font-size:13.5px}
.chip{border-radius:99px;padding:2px 9px;font-weight:700;font-size:12px;color:#fff;background:#1f9d55;height:fit-content}.chip.ng{background:#d64545}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.qc{text-align:center;padding:10px;border:1px solid var(--l);border-radius:12px}
.qc img{width:140px;height:140px;background:#fff;padding:10px;image-rendering:pixelated;border-radius:6px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
</style></head><body>
<video id="v" playsinline muted></video>
<div id="demo" hidden><img id="dq" alt="QR demo"></div>
<canvas id="ov"></canvas><div id="ca"></div>
<div id="top" class="ui"><div><b id="mn">AR Preventive Maintenance</b><small id="ms">Memulai kamera…</small></div>
<div class="r"><span id="prog" hidden></span><button id="bd">Demo</button><button id="bh">Riwayat</button><button id="bq">QR Mesin</button></div></div>
<div id="toast" class="ui" hidden></div>
<div id="dlg" hidden><div class="ui" id="card"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ===== DATA MESIN (edit di sini). x,y = posisi titik dalam cm relatif terhadap pusat QR (x kanan, y bawah); qr = ukuran QR tercetak (cm)
const PT=[
{n:'Clamping unit — tie bar & toggle',x:-38,y:-18,it:[{t:'Pelumasan tie bar & toggle (grease)'},{t:'Tidak ada kebocoran oli di silinder clamp'},{t:'Tekanan clamp',u:'bar',min:120,max:160}]},
{n:'Injection unit — nozzle & heater',x:38,y:-22,it:[{t:'Suhu nozzle',u:'°C',min:180,max:230},{t:'Heater band & kabel dalam kondisi baik'},{t:'Nozzle tidak bocor / drool'}]},
{n:'Tangki oli hidrolik',x:-34,y:20,it:[{t:'Suhu oli hidrolik',u:'°C',min:35,max:55},{t:'Level oli di antara min–max'},{t:'Indikator filter oli tidak clogging'}]},
{n:'Jalur air pendingin',x:36,y:22,it:[{t:'Tekanan air pendingin',u:'bar',min:2,max:5},{t:'Tidak ada kebocoran selang / fitting'},{t:'Strainer bersih'}]},
{n:'Safety door & interlock',x:0,y:-30,it:[{t:'Limit switch pintu berfungsi'},{t:'Interlock area mold berfungsi'},{t:'Guard tidak retak / rusak'}]},
{n:'Panel kontrol & E-stop',x:0,y:30,it:[{t:'Emergency stop berfungsi'},{t:'Panel bersih, filter kipas tidak tersumbat'},{t:'Tegangan suplai',u:'V',min:370,max:420}]}];
const MC={'MLD-001':{name:'Injection Molding 150T',qr:10,pts:PT},'MLD-002':{name:'Injection Molding 350T',qr:10,pts:PT}};
// ===== util
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rec=[],by='';try{rec=JSON.parse(localStorage.getItem('pm.rec')||'[]');by=localStorage.getItem('pm.by')||''}catch(e){}
const persist=()=>{try{localStorage.setItem('pm.rec',JSON.stringify(rec));localStorage.setItem('pm.by',by)}catch(e){}};
const qrimg=(c,cell=6)=>{const q=qrcode(0,'M');q.addData('PM:'+c);q.make();return q.createDataURL(cell,0)};
const today=()=>new Date().toDateString();
const st=(mc,i)=>{const r=[...rec].reverse().find(x=>x.mc==mc&&x.pi==i&&new Date(x.ts).toDateString()==today());return r?r.s:''};
let toastT;const toast=m=>{const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200)};
let lastMsg='';const msg=m=>{if(m!=lastMsg){lastMsg=m;$('#ms').textContent=m}};
// ===== homografi: persegi satuan QR -> koordinat layar
function hom(s,d){const A=[];for(let i=0;i<4;i++){const[x,y]=s[i],[u,w]=d[i];A.push([x,y,1,0,0,0,-x*u,-y*u,u],[0,0,0,x,y,1,-x*w,-y*w,w])}
 for(let i=0;i<8;i++){let m=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];
  for(let r=0;r<8;r++)if(r!=i){const f=A[r][i]/A[i][i];for(let c=i;c<9;c++)A[r][c]-=f*A[i][c]}}
 return A.slice(0,8).map((r,i)=>r[8]/r[i])}
const pj=(h,x,y)=>{const z=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/z,(h[3]*x+h[4]*y+h[5])/z]};
const U=[[0,0],[1,0],[1,1],[0,1]];
// ===== kamera & scan
const v=$('#v'),ov=$('#ov'),cx=ov.getContext('2d'),sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
let demo=false,demoCode='MLD-001',cur=null,corners=null,seen=-1e9,last=0,btns=[];
async function startCam(){try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});v.srcObject=s;await v.play();setDemo(false);msg('Arahkan kamera ke QR Code mesin')}catch(e){setDemo(true);toast('Kamera tidak tersedia — mode demo aktif')}}
function setDemo(on){demo=on;$('#demo').hidden=!on;v.style.display=on?'none':'block';$('#bd').textContent=on?'Kamera':'Demo';if(on){$('#dq').src=qrimg(demoCode);msg('Mode demo: QR simulasi di layar')}resetM()}
function resetM(){cur=null;corners=null;seen=-1e9;$('#ca').innerHTML='';btns=[];$('#prog').hidden=true;$('#mn').textContent='AR Preventive Maintenance'}
function camScan(){const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;const k=Math.min(1,640/vw);sc.width=vw*k;sc.height=vh*k;sx.drawImage(v,0,0,sc.width,sc.height);
 const d=sx.getImageData(0,0,sc.width,sc.height),r=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});if(!r)return null;
 const W=innerWidth,H=innerHeight,s=Math.max(W/vw,H/vh),ox=(W-vw*s)/2,oy=(H-vh*s)/2,l=r.location;
 return{code:r.data.replace(/^PM:/,''),c:[l.topLeftCorner,l.topRightCorner,l.bottomRightCorner,l.bottomLeftCorner].map(p=>[p.x/k*s+ox,p.y/k*s+oy])}}
function demoScan(t){const W=innerWidth,H=innerHeight,cx0=W/2,cy0=H/2+30,a=Math.sin(t/1500)*.1,h=60,q=$('#dq');q.style.left=cx0-h-14+'px';q.style.top=cy0-h-14+'px';q.style.transform=`rotate(${a}rad)`;
 const R=(x,y)=>[cx0+x*Math.cos(a)-y*Math.sin(a),cy0+x*Math.sin(a)+y*Math.cos(a)];return{code:demoCode,c:[R(-h,-h),R(h,-h),R(h,h),R(-h,h)]}}
// ===== mesin & callout
function prog(){const m=MC[cur],n=m.pts.filter((p,i)=>st(cur,i)).length;const e=$('#prog');e.hidden=false;e.textContent=n+'/'+m.pts.length+' titik selesai'}
function setMachine(code){cur=code;const m=MC[code];$('#mn').textContent=code+' · '+m.name;$('#ca').innerHTML='';btns=m.pts.map((p,i)=>{const b=document.createElement('button');b.className='co';b.innerHTML=`${i+1}<span>${esc(p.n)}</span>`;b.setAttribute('aria-label',p.n);b.onclick=()=>openSheet(i);$('#ca').append(b);return b});refresh();msg(code+' terkunci — tap titik untuk isi checksheet')}
function refresh(){btns.forEach((b,i)=>{const s=st(cur,i);b.classList.toggle('ok',s=='ok');b.classList.toggle('ng',s=='ng')});prog()}
function frame(t){requestAnimationFrame(frame);
 if(t-last>(demo?16:100)){last=t;const r=demo?demoScan(t):camScan();
  if(r){if(MC[r.code]){seen=t;if(cur!=r.code){setMachine(r.code);corners=null}corners=corners?r.c.map((p,i)=>[corners[i][0]*.5+p[0]*.5,corners[i][1]*.5+p[1]*.5]):r.c}else msg('QR tidak dikenal: '+r.code)}}
 const W=ov.width=innerWidth,H=ov.height=innerHeight;cx.clearRect(0,0,W,H);const age=t-seen,ca=$('#ca');
 if(!cur||age>3500){ca.style.display='none';if(cur)msg('QR hilang — arahkan kamera ke QR lagi');return}
 ca.style.display='block';ca.style.opacity=age<700?1:.45;const h=hom(U,corners),m=MC[cur];
 cx.lineWidth=3;cx.strokeStyle='#6cc4cc';cx.beginPath();corners.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();cx.stroke();
 const c0=pj(h,.5,.5);m.pts.forEach((p,i)=>{const[x,y]=pj(h,.5+p.x/m.qr,.5+p.y/m.qr);btns[i].style.transform=`translate(${x}px,${y}px)`;
  cx.strokeStyle='rgba(255,255,255,.65)';cx.lineWidth=2;cx.setLineDash([6,6]);cx.beginPath();cx.moveTo(c0[0],c0[1]);cx.lineTo(x,y);cx.stroke();cx.setLineDash([])})}
// ===== dialog & checksheet
const dlg=$('#dlg'),card=$('#card'),show=h=>{card.innerHTML=h;dlg.hidden=false;card.scrollTop=0},hide=()=>{dlg.hidden=true;card.onclick=card.oninput=null};
dlg.onclick=e=>{if(e.target==dlg)hide()};
let ans=[];const okv=(it,a)=>a!=null&&(it.u===undefined?a===1:a>=it.min&&a<=it.max);
function openSheet(i){const m=MC[cur],p=m.pts[i];ans=p.it.map(()=>null);
 show(`<h2>${i+1}. ${esc(p.n)}</h2><p class="sub">${cur} · ${esc(m.name)}</p><label>Nama inspektor<input id="by" value="${esc(by)}" placeholder="Nama / NIK"></label>`+
 p.it.map((it,k)=>`<div class="it" data-k="${k}"><div>${esc(it.t)}${it.u!==undefined?` <small>(std ${it.min}–${it.max} ${it.u})</small>`:''}</div>`+(it.u===undefined?`<div class="seg"><button data-v="1">OK</button><button data-v="0">NG</button></div>`:`<div class="num"><input type="number" inputmode="decimal" step="any" placeholder="Nilai aktual"><span>${it.u}</span></div>`)+`</div>`).join('')+
 `<label>Catatan / temuan<textarea id="nt" rows="2"></textarea></label><div class="ft"><button id="cx">Batal</button><button class="pr" id="sv">Simpan</button></div>`);
 card.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='cx')return hide();
  if(b.dataset.v!==undefined){const k=+b.closest('.it').dataset.k;ans[k]=+b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b))}
  if(b.id=='sv')save(i)};
 card.oninput=e=>{const w=e.target.closest('.it');if(!w||e.target.type!='number')return;const k=+w.dataset.k,n=parseFloat(e.target.value);ans[k]=isNaN(n)?null:n;e.target.className=ans[k]==null?'':okv(p.it[k],ans[k])?'good':'bad'}}
function save(i){const p=MC[cur].pts[i];if(ans.some(a=>a==null))return toast('Lengkapi semua item checksheet');
 by=$('#by').value.trim();if(!by)return toast('Isi nama inspektor');
 const items=p.it.map((it,k)=>({t:it.t,v:ans[k],ok:okv(it,ans[k]),u:it.u||''}));
 rec.push({ts:Date.now(),mc:cur,pi:i,pt:p.n,by,s:items.every(x=>x.ok)?'ok':'ng',items,note:$('#nt').value.trim()});persist();hide();refresh();toast('Tersimpan: '+p.n)}
// ===== riwayat & QR
$('#bh').onclick=()=>{const r=[...rec].reverse().slice(0,60);show(`<h2>Riwayat checksheet</h2><p class="sub">${rec.length} data tersimpan di perangkat ini</p>`+(r.length?r.map(x=>`<div class="row"><div><b>${x.mc}</b> · ${esc(x.pt)}<br><small>${new Date(x.ts).toLocaleString('id-ID')} · ${esc(x.by)}${x.note?' · '+esc(x.note):''}</small></div><span class="chip ${x.s}">${x.s.toUpperCase()}</span></div>`).join(''):'<p>Belum ada data.</p>')+`<div class="ft"><button id="cx">Tutup</button><button id="cp">Salin CSV</button></div>`);
 card.onclick=async e=>{const id=e.target.id;if(id=='cx')hide();if(id=='cp'){const csv='waktu,mesin,titik,status,inspektor,catatan,detail\n'+rec.map(x=>[new Date(x.ts).toISOString(),x.mc,x.pt,x.s,x.by,x.note,x.items.map(i=>`${i.t}=${i.v}${i.u}${i.ok?'':'(NG)'}`).join('; ')].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');try{await navigator.clipboard.writeText(csv);toast('CSV disalin')}catch(_){toast('Clipboard diblokir browser')}}}};
$('#bq').onclick=()=>{show(`<h2>QR Code mesin</h2><p class="sub">Cetak ukuran ±10×10 cm, tempel di bagian depan mesin. Isi QR: PM:&lt;kode mesin&gt;</p><div class="grid">`+Object.keys(MC).map(c=>`<div class="qc"><img src="${qrimg(c,8)}" alt="QR ${c}"><br><b>${c}</b><br><small>${esc(MC[c].name)}</small></div>`).join('')+`</div><div class="ft"><button id="cx">Tutup</button></div>`);card.onclick=e=>{if(e.target.id=='cx')hide()}};
$('#bd').onclick=()=>{if(demo)startCam();else setDemo(true)};
startCam();requestAnimationFrame(frame);
</script></body></html>
